[project]
name = "trading-backtest"
version = "0.1.0"
description = "Intraday strategy backtesting on minute bars"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "backtesting>=0.6.6",
    "exchange-calendars>=4.13.2",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pyarrow>=26.0.0",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
]

[project.scripts]
trading-backtest = "trading_backtest.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.14.0",
    "jupyter>=1.1.1",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
